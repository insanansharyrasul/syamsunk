name: Release to Play Internal

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/upload.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Derive version from tag
        id: version
        run: |
          # ponytail: tag v1.2.3 -> 1.2.3, manual dispatch -> fallback 1.1
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"
          if [[ "$REF_TYPE" == "tag" ]]; then
            TAG="${REF_NAME#v}"
          else
            TAG="1.1"
          fi
          # ponytail: offset ensures versionCode > existing Play versionCode=2
          CODE=$((2 + ${{ github.run_number }}))
          echo "versionName=$TAG" >> $GITHUB_OUTPUT
          echo "versionCode=$CODE" >> $GITHUB_OUTPUT
          echo "Building versionName=$TAG versionCode=$CODE"

      - name: Build AAB
        run: ./gradlew bundleRelease -PversionName=${{ steps.version.outputs.versionName }} -PversionCode=${{ steps.version.outputs.versionCode }}
        env:
          KEYSTORE_PATH: /tmp/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload to Play - Internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.insan.syamsunk
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          # ponytail: draft would require manual publish; completed auto-publishes to internal testers
